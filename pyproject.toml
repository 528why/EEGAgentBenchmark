[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-agent-bench"
version = "1.0.0"
description = "EEGAgentBench: tool-based evaluation of LLM agents on EEG analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "click>=8.1,<9",
  "mne>=1.5,<2",
  "numpy>=1.24,<3",
  "openai>=1,<3",
  "pyyaml>=6,<7",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
data = ["edfio>=0.4,<1"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
eeg-bench = "eeg_agent_bench.cli:main"

[tool.setuptools.packages.find]
include = ["eeg_agent_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
